name: Build TEGARIS82 Android

on:
  push:
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. ~/.config/godot/ || true; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/TEGARIS82-FIGHT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEGARIS82-FIGHT-Android-debug
          path: build/android/TEGARIS82-FIGHT-debug.apk
          if-no-files-found: error
