name: Build TEGARIS82 Android

on:
  workflow_dispatch:
  push:

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK for Godot 4.2.2
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          test -x "$SDK_ROOT/build-tools/33.0.2/aapt"
          test -f "$SDK_ROOT/platforms/android-33/android.jar"

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Verify Android 4.2.2 environment
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          java -version
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK_ROOT=$SDK_ROOT"
          "$SDK_ROOT/build-tools/33.0.2/aapt" version
          test -f "$SDK_ROOT/platforms/android-33/android.jar"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot 4.2.2 Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.2.tres" <<EOF2
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF2
          cat "$HOME/.config/godot/editor_settings-4.2.tres"

      - name: Validate project and Android export preset
        shell: bash
        run: |
          set -euxo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f main.tscn
          grep -E 'name="Android Debug"|gradle_build/use_gradle_build=false' export_presets.cfg
          ! grep -q 'gradle_build/min_sdk' export_presets.cfg
          ! grep -q 'gradle_build/target_sdk' export_presets.cfg
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export GODOT_ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export GODOT_ANDROID_JAVA_SDK_PATH="$JAVA_HOME"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build/android
          echo "SDK: $GODOT_ANDROID_SDK_PATH"
          ls -d "$GODOT_ANDROID_SDK_PATH/platforms/android-33" "$GODOT_ANDROID_SDK_PATH/build-tools/33.0.2"
          godot --headless --path . --verbose --export-debug "Android Debug" build/android/TEGARIS82-FIGHT-debug.apk
          test -s build/android/TEGARIS82-FIGHT-debug.apk
          ls -lh build/android/TEGARIS82-FIGHT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEGARIS82-FIGHT-Android-debug
          path: build/android/TEGARIS82-FIGHT-debug.apk
          if-no-files-found: error
