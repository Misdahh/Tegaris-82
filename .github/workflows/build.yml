name: Build TEGARIS82 Android

"on":
  workflow_dispatch:

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
  uses: android-actions/setup-android@v4
  with:
    cmdline-tools-version: '14742923'
    accept-android-sdk-licenses: true

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          test -f "$SDK_ROOT/platforms/android-33/android.jar"
          test -x "$SDK_ROOT/build-tools/33.0.2/aapt"

      - name: Setup Godot 4.2.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT:-$ANDROID_HOME}\"" \
            'export/android/debug_keystore = "'$HOME'/.android/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.2.tres"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Validate Godot project
        shell: bash
        run: |
          set -e
          godot --version
          test -f project.godot
          test -f main.tscn
          test -f export_presets.cfg
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -e
          mkdir -p build/android
          godot --headless --path . --export-debug 'Android Debug' build/android/TEGARIS82-FIGHT-debug.apk
          test -s build/android/TEGARIS82-FIGHT-debug.apk
          ls -lh build/android/TEGARIS82-FIGHT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEGARIS82-FIGHT-Android-debug
          path: build/android/TEGARIS82-FIGHT-debug.apk
          if-no-files-found: error
          
