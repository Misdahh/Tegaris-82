name: Build TEGARIS82 Android

on:
  workflow_dispatch:
  push:

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify tools
        run: |
          godot --version
          java -version
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0|ndk;23.2.8568313' || true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
EOF

      - name: Validate project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f main.tscn
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android Debug" build/android/TEGARIS82-FIGHT-debug.apk
          test -s build/android/TEGARIS82-FIGHT-debug.apk
          ls -lh build/android/TEGARIS82-FIGHT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEGARIS82-FIGHT-Android-debug
          path: build/android/TEGARIS82-FIGHT-debug.apk
          if-no-files-found: error
